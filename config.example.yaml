# =====================================================================
#  防犯カメラシステム 設定ファイル（雛形）
# ---------------------------------------------------------------------
#  1. このファイルをコピーして「config.yaml」という名前にする
#  2. 少なくとも cameras.main（RTSP アドレス）を自分の環境に書き換える
#  3. python run.py --check-config  で読み込めるか確認
#     python run.py --test-cameras  でカメラにつながるか確認
#
#  ※ config.yaml は .gitignore 済みなので GitHub には上がりません。
#     パスワードや鍵は config.yaml にだけ書き、このファイルには書かないでください。
#  ※ 値を ${環境変数名} と書くと環境変数から読み込みます（${名前:-既定値} も可）。
#  ※ 書かなかった項目は既定値になります。必要なところだけ書けば OK です。
#  ※ 相対パスはこのファイルが置いてあるフォルダが基準です。
# =====================================================================

# ---------------------------------------------------------------------
# カメラ（RTSP）
# ---------------------------------------------------------------------
cameras:
  # メインカメラ: 人・車の検知、録画、ライブ表示に使う
  main:
    url: "rtsp://192.168.1.100:554/stream1"
    # ユーザー名・パスワードは URL に直接書いても、ここに分けて書いても OK。
    # 分けて書くと記号（@ や : など）を含むパスワードも自動でエンコードされます。
    username: "camera_user"
    password: "change-me"            # 環境変数から読むなら "${MAIN_CAMERA_PASSWORD}"

  # サブカメラ: 録画のみ（メインで検知したとき、同じ時間帯を一緒に保存する）
  sub:
    enabled: false                   # 使うなら true
    url: "rtsp://192.168.1.101:554/stream1"
    username: ""
    password: ""

# ---------------------------------------------------------------------
# Web サーバー
# ---------------------------------------------------------------------
server:
  host: "0.0.0.0"                    # 0.0.0.0 = 同じ LAN の他の端末からも見られる / 127.0.0.1 = この PC だけ
  port: 8080                         # HTTPS で運用するなら 443 など
  https: false                       # true にするときは下の証明書が必要
  ssl_cert: "data/certs/cert.pem"
  ssl_key: "data/certs/key.pem"
  local_network_only: true           # 認証オフのとき、LAN 内（プライベート IP）からのアクセスだけ許可
  secret_key: ""                     # ログイン状態を保持する鍵。空なら起動のたびにランダム（再起動でログアウト）
  public_base_url: ""                # 通知画像を絶対 URL にしたいとき。例 "https://camera.example.com"

# ---------------------------------------------------------------------
# パスキー（WebAuthn）認証
#   HTTPS + 下で指定したドメインでアクセスしたときだけ動きます。
# ---------------------------------------------------------------------
auth:
  enabled: false                     # false = ログインなしで全員が管理者扱い（テスト用）
  invite_code: ""                    # 管理者を新規登録するときの招待コード（推測されにくい文字列に）
  rp_id: "camera.example.com"        # パスキーを紐付けるドメイン
  rp_origin: "https://camera.example.com"
  rp_name: "Security Camera"

# ---------------------------------------------------------------------
# 保存先
# ---------------------------------------------------------------------
paths:
  data_dir: "data"                   # ROI 設定・感度・通知購読・パスキーなどの保存先
  recordings_dir: "data/recordings"  # 録画の保存先（容量の大きいドライブ推奨。例 "E:/camera-rec"）
  hls_dir: "data/hls"                # ライブ配信用の一時ファイル
  segments_dir: ""                   # 録画前の一時セグメント。空なら OS の一時フォルダ

# ---------------------------------------------------------------------
# 録画
# ---------------------------------------------------------------------
recording:
  max_gb: 100                        # 録画フォルダの上限。超えたら古いものから消える（ループ録画）
  buffer_before: 10                  # 検知する何秒前から録画に含めるか
  buffer_after: 7                    # 検知が終わってから何秒録画を続けるか
  segment_seconds: 2                 # 一時セグメントの長さ（秒）
  segment_keep_seconds: 45           # 録画していない間に一時セグメントを残す秒数（buffer_before より長く）
  thumbnail_width: 960               # 録画一覧のサムネイルの幅
  ffmpeg_path: "ffmpeg"              # PATH が通っていなければフルパスで。例 "C:/ffmpeg/bin/ffmpeg.exe"
  ffmpeg_hwaccel: ""                 # GPU でデコードしたいとき "cuda" など（通常は空）

# ---------------------------------------------------------------------
# ライブ配信（HLS）
# ---------------------------------------------------------------------
live:
  hls_enabled: false                 # true でホーム画面・設定画面にライブ映像を表示（少し負荷が増える）

# ---------------------------------------------------------------------
# 検知（YOLO）
# ---------------------------------------------------------------------
detection:
  enabled: true                      # false にすると Web 画面だけ動かせる
  model: "yolov8s.pt"                # 無ければ初回起動時に自動ダウンロード。自前の学習済みモデルのパスも可
  device: "auto"                     # auto / cuda / cpu
  fps: 10                            # 1秒あたり何コマ検知にかけるか（GTX1070 なら 8〜12 が目安）
  width: 960                         # 検知に使う映像サイズ（カメラ映像と同じ縦横比に）
  height: 540
  imgsz: 960                         # YOLO の入力サイズ（width に合わせる）
  roi_width: 640                     # 検出範囲（ROI）の座標系。設定画面の表示サイズ（カメラと同じ縦横比に）
  roi_height: 360
  # ↓ 感度の初期値（設定画面から変更でき、変更後は data/sensitivity.json が優先されます）
  confidence: 0.35                   # YOLO の信頼度の閾値。低いほど検知しやすい・誤検知も増える
  motion_threshold_person: 10        # 人の動きの閾値。低いほど敏感
  motion_threshold_car: 30           # 車の動きの閾値。低いほど敏感
  show_debug_window: false           # 検知中の映像を OpenCV のウィンドウで表示する（デバッグ用）

# ---------------------------------------------------------------------
# プッシュ通知（Web Push）
#   python tools/gen_vapid_keys.py で鍵を作って貼り付けてください。
#   ブラウザの仕様で、通知の登録は HTTPS か localhost でアクセスしたときだけできます。
# ---------------------------------------------------------------------
notifications:
  vapid_public_key: ""
  vapid_private_key: ""              # 秘密鍵。絶対に公開しないこと
  vapid_subject: "mailto:you@example.com"
  thumbnail_width: 320               # 通知に付ける画像の幅
  thumbnail_quality: 80
